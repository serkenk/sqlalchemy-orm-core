name: CI Pipeline

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev"]

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    name: Automated Tests (Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: notes_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notes_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/notes_test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/notes_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_for_testing_only
        run: alembic upgrade head

      - name: Run Async Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/notes_test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/notes_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_for_testing_only
        run: pytest -v
