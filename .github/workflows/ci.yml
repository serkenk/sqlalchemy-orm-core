name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_notes_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff (Linter & Code Formatting)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy (Static Type Check)
        run: |
          mypy .

      - name: Run Pytest (Integration Tests)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/test_notes_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/test_notes_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_only_32_bytes_len
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: |
          pytest -v
